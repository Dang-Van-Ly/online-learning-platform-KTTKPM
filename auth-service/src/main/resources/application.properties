# ======================
# SERVER PORT
# ======================
server.port=8081

# ======================
# DATABASE (MariaDB)
# ======================
spring.datasource.url=jdbc:mariadb://db:3306/online_learning
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# ======================
# REDIS
# ======================
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.timeout=2000


# ======================
# CACHE
# ======================
spring.cache.type=none


# ======================
# JACKSON (Java 8 Date/Time)
# ======================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.write-durations-as-timestamps=false


# ======================
# MAIL (SMTP Gmail)
# ======================
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=dthn2004@gmail.com
spring.mail.password=bkmxqlnghgfesech

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.starttls.enable=false

# AWS S3 & CloudFront

cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION}
cloud.aws.s3.bucket=${AWS_BUCKET_NAME}

# ======================
# MULTIPART UPLOAD
# ======================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB