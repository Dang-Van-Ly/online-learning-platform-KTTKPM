# Local profile for running without Docker database and Redis

spring.datasource.url=jdbc:h2:mem:online_learning;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MariaDB
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
spring.redis.enabled=false

# Local AWS fallback values to allow startup when AWS env vars are not present
AWS_ACCESS_KEY=local
AWS_SECRET_KEY=local
AWS_REGION=us-east-1
AWS_BUCKET_NAME=local-bucket

spring.cache.type=none
